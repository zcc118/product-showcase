<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="拾物日常，发现适合日常的生活好物。浏览商品，联系店主了解详情。"><title>拾物日常 · 生活选物</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a45ce'/%3E%3Ctext x='16' y='23' text-anchor='middle' fill='white' font-size='22'%3ES%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="assets/style.css"><script src="assets/app.js" defer></script></head>
<body><header class="header"><a class="brand" href="./"><span class="brandmark">S.</span><span>拾物日常<small>SHIWU · EVERYDAY GOODS</small></span></a><button class="contact-trigger outline">联系店主 <span aria-hidden="true">↗</span></button></header>
<main><section class="intro"><div><p class="eyebrow">THE EVERYDAY EDIT / 生活选物集</p><h1>把喜欢，带进日常。</h1><p class="subtitle">从一只杯子到一个随行包，发现简单、耐用、刚刚好的生活好物。</p></div><div class="edition"><span>VOL. 01</span><strong>日常有物</strong><small>精选日用 · 慢慢挑选</small></div></section>
<section aria-label="商品目录" class="catalog"><div class="catalog-top"><h2>全部选物 <span id="total"></span></h2><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索名称、编号或关键词" aria-label="搜索商品"></label></div><div class="filter-row"><div id="categories" class="categories" role="group" aria-label="商品分类"></div><span id="count" role="status" aria-live="polite"></span></div><div id="grid" class="grid" aria-label="商品列表"></div><div id="state" class="state" role="status">正在加载选物…</div></section>
<section class="contact-strip"><div><p class="eyebrow">LET’S TALK</p><h2>看到喜欢的，聊聊它。</h2><p>记下商品编号，联系店主咨询颜色、尺寸与现货情况。</p></div><button class="contact-trigger primary">联系店主</button></section></main>
<footer><span>拾物日常 © 2026</span><span>展示 Demo · 价格、商品与图片均为样例</span></footer>
<dialog id="detail" aria-labelledby="detail-title"><button class="close" aria-label="关闭商品详情">×</button><div class="detail-layout"><div class="gallery"><div class="main-image"><img id="detail-image" alt=""><button id="prev" aria-label="上一张图片">‹</button><button id="next" aria-label="下一张图片">›</button><span id="image-count"></span></div><div id="thumbs" class="thumbs" aria-label="商品图片"></div></div><div class="detail-info"><p id="detail-meta" class="eyebrow"></p><h2 id="detail-title"></h2><p id="detail-price" class="detail-price"></p><p id="detail-desc"></p><dl id="detail-specs"></dl><p class="note">样例商品 · 图片为示意占位图<br>实际颜色、价格与库存请联系店主确认。</p><button id="inquire" class="primary">咨询这件商品</button></div></div></dialog>
<dialog id="contact" aria-labelledby="contact-title"><button class="close" aria-label="关闭联系方式">×</button><p class="eyebrow">SAY HELLO</p><h2 id="contact-title">联系店主</h2><p id="contact-note"></p><label for="inquiry">咨询内容</label><textarea id="inquiry" readonly rows="3"></textarea><button id="copy" class="primary">复制咨询内容</button><p id="copy-status" role="status" aria-live="polite"></p><div id="contact-methods"></div></dialog>
<noscript><p class="state">请启用 JavaScript 以浏览商品目录。</p></noscript></body></html>
